services:
  - type: web
    name: bonsailab
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --max-requests 500 --max-requests-jitter 50
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: PYTHONUNBUFFERED
        value: "1"
